  <style>
    /* Colors from the alpinebox logo */
    :root { --text: #12233A; --muted: #5B6B80; --bg: #F7FAFD; --card: #E6EFF6; --link: #2A6F9E; --accent: #4F9FCB; }
    @media (prefers-color-scheme: dark) { :root { --text: #F2F7FB; --muted: #9DB3C8; --bg: #0F1C2E; --card: #1A3352; --link: #7CC4E8; --accent: #7CC4E8; } }
    body { font-family: system-ui, sans-serif; max-width: 40em; margin: 10vh auto; padding: 0 1em; line-height: 1.5; color: var(--text); background: var(--bg); }
    ul { list-style: none; padding: 0; }
    li a { display: block; padding: .75em 1em; margin-bottom: .5em; background: var(--card); border-radius: 6px; color: var(--link); text-decoration: none; }
    li a:hover { text-decoration: underline; }
    .path { color: var(--muted); font-size: .85em; margin-left: .5em; }
    .disabled a { color: var(--muted); }
    #status { color: var(--muted); }
    footer { margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--card); }
    .powered-by { display: inline-flex; align-items: center; gap: .6em; color: var(--muted); font-size: .85em; text-decoration: none; opacity: .7; }
    .powered-by:hover { opacity: 1; }
    .footer-logo { display: block; width: 7em; height: auto; }
    header .logo { display: block; width: 18em; max-width: 100%; height: auto; }
    header h1 { margin: .5em 0 0; }
    .logo-wordmark-dark { fill: #12233A; }
    @media (prefers-color-scheme: dark) { .logo-wordmark-dark { fill: var(--text); } }
  </style>

  <script>
    // Lists every Traefik router whose rule contains PathPrefix(`<admin prefix>/<something>`),
    // so new admin interfaces under the admin prefix show up here automatically.
    // The admin prefix is taken from the url this page is served on (ADMIN_PREFIX in .env).
    const adminPrefix = location.pathname.replace(/\/+$/, '');
    const traefikRoutersUrl = adminPrefix + '/traefik/api/http/routers?per_page=1000';
    const statusText = document.getElementById('status');
    const adminLinkList = document.getElementById('admin-links');

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function addAdminLink(adminPath, isEnabled) {
      const listItem = document.createElement('li');
      if (!isEnabled) listItem.className = 'disabled';
      const link = document.createElement('a');
      link.href = adminPath + '/';
      link.textContent = adminPath.slice(adminPrefix.length + 1);
      const pathLabel = document.createElement('span');
      pathLabel.className = 'path';
      pathLabel.textContent = adminPath + '/' + (isEnabled ? '' : ' (disabled)');
      link.appendChild(pathLabel);
      listItem.appendChild(link);
      adminLinkList.appendChild(listItem);
    }

    async function showAdminLinks() {
      const pathPrefixPattern = new RegExp('PathPrefix\\(`(' + escapeRegExp(adminPrefix) + '/[^`/]+)/?`\\)', 'g');
      const isEnabledByAdminPath = new Map();
      try {
        const response = await fetch(traefikRoutersUrl);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const traefikRouters = await response.json();
        for (const traefikRouter of traefikRouters) {
          for (const ruleMatch of (traefikRouter.rule || '').matchAll(pathPrefixPattern)) {
            const adminPath = ruleMatch[1];
            const isEnabled = traefikRouter.status === 'enabled';
            isEnabledByAdminPath.set(adminPath, isEnabledByAdminPath.get(adminPath) || isEnabled);
          }
        }
      } catch (fetchError) {
        statusText.textContent = 'Could not read the routers from the Traefik API (' + fetchError.message + ').';
        addAdminLink(adminPrefix + '/traefik', true);
        return;
      }
      const sortedAdminPaths = [...isEnabledByAdminPath.keys()].sort();
      statusText.textContent = sortedAdminPaths.length ? '' : 'No admin interfaces found.';
      for (const adminPath of sortedAdminPaths) addAdminLink(adminPath, isEnabledByAdminPath.get(adminPath));
    }

    showAdminLinks();
  </script>
