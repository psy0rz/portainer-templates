# Core environment to use the other templates with.
# Its a treafik + portainer + watchdog stack.
# Use on Alpinbox with ZFS docker volume support.

# https://raw.githubusercontent.com/psy0rz/portainer-templates/main/templates.json

# Treafik dashboard is on https://host/treafik/dashboard


services:
  traefik:
    image: "traefik:v3.6"
    restart: unless-stopped

    command:
      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entryPoints.web.http.encodedCharacters.allowEncodedSlash=true"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedSlash=true"
      - "--entrypoints.websecure.http.tls.certresolver=${DEFAULT_ACME_PROVIDER}"
      - "--entryPoints.landing.address=:81"
      - "--providers.docker.network=proxynet"
      - "--providers.docker.defaultRule="
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.httpChallenge.entryPoint=web"
      - "--certificatesresolvers.letsencrypt.acme.storage=/storage/letsencrypt.json"
      - "--certificatesresolvers.myzerossl.acme.email=${ZEROSSL_EMAIL}"
      - "--certificatesresolvers.myzerossl.acme.storage=/storage/acme.json"
      - "--certificatesresolvers.myzerossl.acme.caserver=${ZEROSSL_CASERVER}"
      - "--certificatesresolvers.myzerossl.acme.eab.kid=${ZEROSSL_KID}" 
      - "--certificatesresolvers.myzerossl.acme.eab.hmacEncoded=${ZEROSSL_HMAC}"
      - "--certificatesresolvers.myzerossl.acme.httpChallenge.entryPoint=web"
      - "--accessLog"

      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5,10"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"

      # - "--experimental.otlpLogs=true"
      # - "--accesslog.otlp.grpc=true"
      # - "--accesslog.otlp.grpc.endpoint=stats-vl-1:4317"
      # - "--accesslog.otlp.grpc.insecure=true"

      # - "--tracing=true"
      # - "--tracing.otlp.grpc=true"
      # - "--tracing.addInternals=true"
      # - "--tracing.otlp.grpc=true"
      # - "--tracing.otlp.grpc.endpoint=stats.server.bla:4317"
      # - "--tracing.otlp.grpc.insecure=true"

      # victoria metrics logging
      # - "--experimental.otlpLogs=true"
      # - "--accesslog.otlp.http=${OTLP}"
      # - "--accesslog.otlp.http.endpoint=${OTLP_ENDPOINT}"
      # - "--accesslog.otlp.http.headers.Authorization=${OTLP_AUTH}" # echo -n user:pass|base64
      # - "--accesslog.fields.headers.defaultMode=keep"

      # custom certs
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/certs.yml
      - --providers.file.watch=true

    #NOTE: use docker-compose.override.yml to make a seperate ip as landing page for reserved domains (see docker-compose.override.yml.example)
    ports:
      - "80:80"
      - "443:443"
    

    volumes:
     - "/var/run/docker.sock:/var/run/docker.sock:ro"
     - traefik:/storage
     - ./htpasswd:/etc/traefik/htpasswd:ro 
     - ./certs.yml:/etc/traefik/certs.yml:ro
     - ./certs:/certs:ro

    networks:
      - proxynet
      - default

    hostname: ${DOMAIN}      

    labels:
      # Traefik status page
      - "traefik.enable=true"

      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`) && ( PathPrefix(`/traefik`) || HeaderRegexp(`Referer`, `/traefik`) )"
      - "traefik.http.routers.dashboard.priority=999"
      - "traefik.http.routers.dashboard.middlewares=strip-traefik"
      - "traefik.http.middlewares.strip-traefik.stripprefix.prefixes=/traefik"

      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      - "traefik.http.routers.dashboard.service=dashboard"
      # - "traefik.http.routers.dashboard.tls.certresolver=myzerossl"

      # redirect all http to https
      - traefik.http.routers.http-catchall.rule=hostregexp(`.*`)
      - traefik.http.routers.http-catchall.entrypoints=web
      - traefik.http.routers.http-catchall.middlewares=redirect-to-https
      - traefik.http.routers.http-catchall.priority=-1
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

      # Router specifically for xmlrpc.php to block it globally (wordpress)
      - traefik.http.routers.xmlrpc.rule=PathPrefix(`/xmlrpc.php`)
      - traefik.http.routers.xmlrpc.priority=1000
      - traefik.http.routers.xmlrpc.tls=true

      # Generic auth used to protect some webinterfaces
      # Use:       - traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.middlewares=auth
      - "traefik.http.middlewares.auth.basicauth.usersFile=/etc/traefik/htpasswd"



    stop_grace_period: 0s


  portainer:
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock --admin-password ${PORTAINER_ADMIN_PASSWORD}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer:/data

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      # - "traefik.http.routers.portainer.tls.certresolver=myzerossl"

    stop_grace_period: 0s

  watchtower:
    restart: unless-stopped
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --rolling-restart --schedule "0 0 4 * * *"

  maintenance:
    image: wickerlabs/maintenance
    restart: unless-stopped
    environment:
      TEAM_NAME: "Uw web team"
      HEADLINE: "Website onderhoud"
      TITLE: "Website onderhoud"
      MAIL_ADDRESS: "info@datux.nl"
      # LINK_COLOR: "#dc8100"
      # THEME: "Light"
      PORT: 8080
      RESPONSE_CODE: "503 Service Unavailable"
      MESSAGE: "In verband met onderhoud is deze site tijdelijk onbereikbaar. Als dit probleem aanhoudt, neem dan contact met ons op."
      CONTACT_LINK: "neem contact op"

    labels:
      - traefik.enable=true
      # catch all for when containers are down for maintanance:
      - traefik.http.routers.https-catchall.rule=hostregexp(`.*`)
      - traefik.http.services.https-catchall.loadbalancer.server.port=8080
      - traefik.http.routers.https-catchall.entrypoints=websecure
      - traefik.http.routers.https-catchall.tls=true
      - traefik.http.routers.https-catchall.priority=-1


    stop_grace_period: 0s


    networks:
      - proxynet
      - default

  # templates:
  #   image: nginx:alpine
  #   volumes:
  #     - ..:/usr/share/nginx/html/


networks:
  proxynet:
    name: proxynet

volumes:
 traefik:
   driver: zfs
 portainer:
   driver: zfs


