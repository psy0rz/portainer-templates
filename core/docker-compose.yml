# Core environment to use the other templates with.
# Its a treafik + portainer + watchtower + victorialogs stack.
# Use on Alpinebox (https://github.com/psy0rz/alpinebox) with ZFS docker volume support.

# https://raw.githubusercontent.com/psy0rz/portainer-templates/main/templates.json

# Admin interfaces live under ADMIN_PREFIX (default /server-manager):
#   Overview:          https://host/server-manager/
#   Traefik dashboard: https://host/server-manager/traefik/dashboard/
#   Portainer:         https://host/server-manager/portainer/
#   Logs:              https://host/server-manager/victoria-logs/select/vmui/
# Login (Authelia):    https://host/authelia/
#
# Run ./setup.sh the first time. Do not use "docker compose up" first: Authelia needs the files that setup.sh creates.


services:
  traefik:
    image: "traefik:v3"
    restart: unless-stopped

    command:
      - "--log.level=INFO"
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--api.basepath=${ADMIN_PREFIX:-/server-manager}/traefik/"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entryPoints.web.http.encodedCharacters.allowEncodedSlash=true"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedSlash=true"
      - "--entrypoints.websecure.http.tls.certresolver=${DEFAULT_ACME_PROVIDER}"
      - "--entryPoints.landing.address=:81"
      - "--providers.docker.network=proxynet"
      - "--providers.docker.defaultRule="
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.httpChallenge.entryPoint=web"
      - "--certificatesresolvers.letsencrypt.acme.storage=/storage/letsencrypt.json"
      - "--certificatesresolvers.myzerossl.acme.email=${ZEROSSL_EMAIL}"
      - "--certificatesresolvers.myzerossl.acme.storage=/storage/acme.json"
      - "--certificatesresolvers.myzerossl.acme.caserver=${ZEROSSL_CASERVER}"
      - "--certificatesresolvers.myzerossl.acme.eab.kid=${ZEROSSL_KID}" 
      - "--certificatesresolvers.myzerossl.acme.eab.hmacEncoded=${ZEROSSL_HMAC}"
      - "--certificatesresolvers.myzerossl.acme.httpChallenge.entryPoint=web"
      - "--accessLog"

      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5,10"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"

      # Send the traefik log and the access log to victorialogs (OTLP over http).
      # The access log also stays on stdout.
      - "--experimental.otlpLogs=true"
      - "--log.otlp.http.endpoint=http://victorialogs:9428${ADMIN_PREFIX:-/server-manager}/victoria-logs/insert/opentelemetry/v1/logs"
      - "--accesslog.otlp.http.endpoint=http://victorialogs:9428${ADMIN_PREFIX:-/server-manager}/victoria-logs/insert/opentelemetry/v1/logs"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Referer=keep"

      # custom certs
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/certs.yml
      - --providers.file.watch=true

    #NOTE: use docker-compose.override.yml to make a seperate ip as landing page for reserved domains (see docker-compose.override.yml.example)
    ports:
      - "80:80"
      - "443:443"
    

    volumes:
     - "/var/run/docker.sock:/var/run/docker.sock:ro"
     - traefik:/storage
     # Long syntax with create_host_path: false, so compose stops with an error if certs.yml does not exist.
     # (The short syntax creates an empty directory instead.)
     - type: bind
       source: ./certs.yml
       target: /etc/traefik/certs.yml
       read_only: true
       bind:
         create_host_path: false
     - ./certs:/certs:ro

    networks:
      proxynet:
      default:
        # Portainer gets the OAuth tokens from Authelia through https://DOMAIN/authelia/ (Authelia accepts
        # only https). With this alias, DOMAIN points to traefik inside the network, so Portainer
        # does not need a route to the public IP address of the server.
        aliases:
          - ${DOMAIN}

    labels:
      # Traefik status page
      - "traefik.enable=true"

      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`) && PathPrefix(`${ADMIN_PREFIX:-/server-manager}/traefik`)"
      - "traefik.http.routers.dashboard.priority=100000"

      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.observability.accessLogs=false"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # - "traefik.http.routers.dashboard.service=dashboard"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      # - "traefik.http.routers.dashboard.tls.certresolver=myzerossl"

      # redirect all http to https
      - traefik.http.routers.http-catchall.rule=hostregexp(`.*`)
      - traefik.http.routers.http-catchall.entrypoints=web
      - traefik.http.routers.http-catchall.observability.accessLogs=false
      - traefik.http.routers.http-catchall.middlewares=redirect-to-https
      - traefik.http.routers.http-catchall.priority=-1
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

    stop_grace_period: 0s


  portainer:
    image: portainer/portainer-ce:latest
    # --admin-password-file: Portainer creates the first admin with this random password (made by setup.sh).
    # setup.sh resets the admin password each time it runs, so this file is only used at the first start.
    command: -H unix:///var/run/docker.sock --log-level ${PORTAINER_LOG_LEVEL:-DEBUG} --base-url ${ADMIN_PREFIX:-/server-manager}/portainer/ --admin-password-file /run/portainer_initial_admin_password
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer:/data
      - type: bind
        source: ./authelia/secrets/portainer_initial_admin_password
        target: /run/portainer_initial_admin_password
        read_only: true
        bind:
          create_host_path: false

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${DOMAIN}`) && PathPrefix(`${ADMIN_PREFIX:-/server-manager}/portainer`)"
      - "traefik.http.routers.portainer.priority=100000"

      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.observability.accessLogs=false"
      - "traefik.http.routers.portainer.middlewares=auth,portainer-stripprefix"
      - "traefik.http.middlewares.portainer-stripprefix.stripprefix.prefixes=${ADMIN_PREFIX:-/server-manager}/portainer"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      # - "traefik.http.routers.portainer.tls.certresolver=myzerossl"
      # - "traefik.http.routers.portainer.tls=true"

    stop_grace_period: 0s

  # Authelia: login portal on https://host/authelia/.
  # (Authelia accepts only one path segment with only letters and digits, so it cannot run under ADMIN_PREFIX.)
  # - It supplies the generic "auth" middleware (traefik forward auth) for the admin interfaces.
  # - It is the OpenID Connect provider for the Portainer login ("Login with OAuth").
  # Config: ./authelia/configuration.yml. Run ./setup.sh first: it creates the users file and the secrets.
  authelia:
    image: authelia/authelia:4
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_PREFIX: ${ADMIN_PREFIX:-/server-manager}
      ADMIN_AUTH_POLICY: ${ADMIN_AUTH_POLICY:-one_factor}
      X_AUTHELIA_CONFIG: /config/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage_encryption_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /config/secrets/oidc_hmac_secret
    volumes:
      - ./authelia:/config:ro
      - authelia:/data

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`${DOMAIN}`) && PathPrefix(`/authelia`)"
      - "traefik.http.routers.authelia.priority=100000"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.observability.accessLogs=false"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

      # Generic auth used to protect some webinterfaces
      # Use:       - traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.middlewares=auth
      # Users are in ./authelia/users_database.yml. To change the admin password, run ./setup.sh.
      - "traefik.http.middlewares.auth.forwardauth.address=http://authelia:9091/authelia/api/authz/forward-auth"
      - "traefik.http.middlewares.auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.auth.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name"

    networks:
      - proxynet
      - default

    stop_grace_period: 0s

  # Victorialogs: stores the traefik log and access log.
  # Web UI: https://host/server-manager/victoria-logs/select/vmui/ (protected with the generic auth middleware)
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    restart: unless-stopped
    command:
      - "-retentionPeriod=${LOGS_RETENTION:-30d}"
      - "-http.pathPrefix=${ADMIN_PREFIX:-/server-manager}/victoria-logs"
    volumes:
      - victorialogs:/victoria-logs-data

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.victorialogs.rule=Host(`${DOMAIN}`) && PathPrefix(`${ADMIN_PREFIX:-/server-manager}/victoria-logs`)"
      - "traefik.http.routers.victorialogs.priority=100000"
      - "traefik.http.routers.victorialogs.entrypoints=websecure"
      - "traefik.http.routers.victorialogs.observability.accessLogs=false"
      - "traefik.http.routers.victorialogs.middlewares=auth"
      - "traefik.http.services.victorialogs.loadbalancer.server.port=9428"

    networks:
      - proxynet
      - default

    stop_grace_period: 0s

  watchtower:
    restart: unless-stopped
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No --rolling-restart: it refuses containers with depends_on (nextcloud, magento).
    command: --schedule "0 0 4 * * *"

  # Portal: nginx serving ./portal/www, config in ./portal/nginx.conf.template.
  # Serves the admin overview page, the blocked paths page (403) and a catch-all maintenance page (503)
  # for hosts whose containers are down.
  maintanance:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      PORTAL_CONTACT_EMAIL: ${PORTAL_CONTACT_EMAIL}
    volumes:
      - ./portal/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./portal/www:/usr/share/nginx/html:ro

    labels:
      - traefik.enable=true
      # catch all for when containers are down for maintanance:
      - traefik.http.services.portal.loadbalancer.server.port=8080

      - traefik.http.routers.https-catchall.rule=hostregexp(`.*`)
      - traefik.http.routers.https-catchall.entrypoints=websecure
      - traefik.http.routers.https-catchall.observability.accessLogs=false
      # - traefik.http.routers.https-catchall.tls=true
      - traefik.http.routers.https-catchall.priority=-1
      - traefik.http.routers.https-catchall.service=portal

      # Overview page of all admin interfaces (every router with PathPrefix(`ADMIN_PREFIX/...`), read from the traefik api)
      - "traefik.http.routers.server-manager.rule=Host(`${DOMAIN}`) && (Path(`${ADMIN_PREFIX:-/server-manager}`) || Path(`${ADMIN_PREFIX:-/server-manager}/`))"
      - traefik.http.routers.server-manager.priority=100000
      - traefik.http.routers.server-manager.entrypoints=websecure
      - traefik.http.routers.server-manager.observability.accessLogs=false
      - traefik.http.routers.server-manager.middlewares=auth,server-manager-page
      - traefik.http.middlewares.server-manager-page.replacepath.path=/server-manager.html
      - traefik.http.routers.server-manager.service=portal

      # Block paths probed by bad bots and exploit scanners, globally for all hosts.
      # The portal shows blocked.html with status 403 Forbidden.
      # Matches at any depth (e.g. /blog/xmlrpc.php):
      #   xmlrpc.php (wordpress), .git .svn .hg .bzr (VCS metadata), .aws .ssh (credentials),
      #   .env .env.* (secrets), .htaccess .htpasswd, .DS_Store, wp-config.php.* (config backups),
      #   *.log (debug.log, error.log etc.)
      # Only whole path segments match, so gitea clone urls like /user/repo.git stay reachable.
      # $$ escapes $ for docker compose interpolation.
      - traefik.http.routers.blocked-paths.rule=PathRegexp(`/(xmlrpc\.php|\.(git|svn|hg|bzr|aws|ssh)(/.*)?|\.env(\.[^/]*)?|\.ht(access|passwd)|\.DS_Store|wp-config\.php\.[^/]+|[^/]*\.log)$$`)
      - traefik.http.routers.blocked-paths.priority=1000
      - traefik.http.routers.blocked-paths.entrypoints=websecure
      - traefik.http.routers.blocked-paths.observability.accessLogs=false
      - traefik.http.routers.blocked-paths.tls=true
      - traefik.http.routers.blocked-paths.middlewares=blocked-paths-page
      - traefik.http.middlewares.blocked-paths-page.replacepath.path=/blocked
      - traefik.http.routers.blocked-paths.service=portal


    stop_grace_period: 0s


    networks:
      - proxynet
      - default

  # templates:
  #   image: nginx:alpine
  #   volumes:
  #     - ..:/usr/share/nginx/html/


networks:
  proxynet:
    name: proxynet

volumes:
 traefik:
   driver: ${VOLUME_DRIVER-zfs}
 portainer:
   driver: ${VOLUME_DRIVER-zfs}
 victorialogs:
   driver: ${VOLUME_DRIVER-zfs}
 authelia:
   driver: ${VOLUME_DRIVER-zfs}


